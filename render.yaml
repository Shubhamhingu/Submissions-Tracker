# Render Blueprint -- deploy with: Render dashboard -> New -> Blueprint -> pick this repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: count-automation
    runtime: python
    # FREE plan: no persistent disk, so the SQLite file lives next to the code
    # and is EPHEMERAL -- it resets to seed.sql on every deploy / spin-down.
    # For data that persists, switch to `plan: starter` and add the `disk:` block
    # (mountPath /var/data) plus DATABASE_URL=sqlite:////var/data/count_automation.db
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true          # Render generates a random value
      - key: APP_PASSWORD_HASH
        sync: false                  # you paste this in the dashboard
      - key: OPENAI_API_KEY
        sync: false                  # optional; enables the "Ask the data" tab
      - key: OPENAI_MODEL
        value: gpt-4o-mini
